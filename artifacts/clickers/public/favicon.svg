<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: deep forest green rounded square -->
  <rect width="64" height="64" rx="14" fill="#23432E"/>

  <!-- Outer arch / dome — antique gold -->
  <path d="M14 38 Q14 18 32 16 Q50 18 50 38" stroke="#B49A63" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Book base — open pages spreading outward -->
  <!-- Left page -->
  <path d="M32 44 L14 40 L14 28 Q23 30 32 34 Z" fill="#B49A63" opacity="0.9"/>
  <!-- Right page -->
  <path d="M32 44 L50 40 L50 28 Q41 30 32 34 Z" fill="#C5AD7D" opacity="0.9"/>
  <!-- Book spine line (center) -->
  <line x1="32" y1="34" x2="32" y2="44" stroke="#23432E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left page lines (text simulation) -->
  <line x1="18" y1="33" x2="28" y2="35.5" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="36" x2="28" y2="38" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="39" x2="28" y2="40.5" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>

  <!-- Right page lines (text simulation) -->
  <line x1="46" y1="33" x2="36" y2="35.5" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="36" x2="36" y2="38" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="39" x2="36" y2="40.5" stroke="#23432E" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>

  <!-- Gold star / ornament at apex of arch -->
  <circle cx="32" cy="15.5" r="2.5" fill="#B49A63"/>
  <line x1="32" y1="11.5" x2="32" y2="19.5" stroke="#B49A63" stroke-width="1.2"/>
  <line x1="28" y1="15.5" x2="36" y2="15.5" stroke="#B49A63" stroke-width="1.2"/>

  <!-- Subtle glow dots on arch corners -->
  <circle cx="14" cy="38" r="1.5" fill="#B49A63"/>
  <circle cx="50" cy="38" r="1.5" fill="#B49A63"/>
</svg>
